{% extends 'index.html' %}

{% block content %}
  <section class="analise-categoria">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h1>Análise de Categorias</h1>
        <a href="{% url 'tarefas' %}" class="btn-back">← Voltar ao calendário</a>
      </div>
      <button class="btn-create" id="openModalBtn" type="button">Criar Tarefa</button>
    </div>

    <form action="#">
      <select name="categorias" id="cat_id">
        <option value="nenhuma">nenhuma</option>
        {% for nome in nomes %}
          <option value="{{ nome }}">{{ nome }}</option>
        {% endfor %}
      </select>
    </form>
  </section>

  <div class="analise-secoes-wrapper">
    <section class="analise-card tarefas_a_fazer">
      <h2>Em espera</h2>
      <div class="task-list" id="list-espera"></div>
    </section>
    <section class="analise-card tarefas_andamento">
      <h2>Em andamento</h2>
      <div class="task-list" id="list-andamento"></div>
    </section>
    <section class="analise-card tarefas_concluidas">
      <h2>Concluídas</h2>
      <div class="task-list" id="list-concluidas"></div>
    </section>
  </div>

  <!-- Modal de Criação de Tarefa -->
  <div id="taskModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Nova Tarefa</h2>
        <span class="close-modal">&times;</span>
      </div>
      <form id="createTaskForm" action="{% url 'adicionar_tarefa' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_nome">Nome</label>
          <input type="text" name="nome" id="id_nome" required>
        </div>

        <div class="form-group">
          <label for="id_descricao">Descrição</label>
          <textarea name="descricao" id="id_descricao"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="id_prioridade">Prioridade</label>
            <select name="prioridade" id="id_prioridade">
              {% for val, label in prioridades %}
                <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="id_status">Status</label>
            <select name="status" id="id_status">
              {% for val, label in status_list %}
                <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Tempo Estimado</label>
          <div class="time-inputs">
            <input type="number" name="horas_estimadas_horas" placeholder="Horas" min="0" value="0">
            <span>h</span>
            <input type="number" name="horas_estimadas_minutos" placeholder="Minutos" min="0" max="59" value="0">
            <span>m</span>
          </div>
        </div>

        <div class="form-group">
          <label for="id_categoria">Categoria</label>
          <select name="categoria" id="id_categoria">
            <option value="">Nenhuma</option>
            {% for cat in categorias %}
              <option value="{{ cat.id }}">{{ cat.nome }}</option>
            {% endfor %}
          </select>
        </div>

        <input type="hidden" name="data" value="{{ today|date:'Y-m-d' }}">

        <div class="modal-footer">
          <button type="button" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-save">Salvar Tarefa</button>
        </div>
      </form>
    </div>
  </div>


{% endblock %}
